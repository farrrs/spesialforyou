
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Little Scrapbook ♡</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- File CSS -->
  <link rel="stylesheet" href="style2.css">
</head>

<body>

  <!-- Background hearts -->
  <div class="background-hearts" id="backgroundHearts"></div>

  <main class="scrapbook">

    <!-- Header -->
    <header class="scrapbook-header">
      <p class="eyebrow">
        <span>✦</span>
        A LITTLE BOOK ABOUT US
        <span>✦</span>
      </p>

      <h1>Our Little Scrapbook <span>♡</span></h1>

      <p class="subtitle">
        Every page holds a little piece of my heart.
      </p>

      <div class="header-flourish" aria-hidden="true">
        ❀ &nbsp; ♡ &nbsp; ❀
      </div>
    </header>

    <!-- Scrapbook book -->
    <section class="book">

      <div class="book-decoration" aria-hidden="true">♡</div>

      <!-- Decorative tape -->
      <span class="paper-tape tape-left" aria-hidden="true"></span>
      <span class="paper-tape tape-right" aria-hidden="true"></span>

      <!-- Page counter -->
      <div class="page-counter">
        <span id="currentPage">1</span>
        <span class="counter-divider">/</span>
        <span id="totalPages">25</span>
      </div>

      <!-- Progress bar -->
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <!-- Page content generated by JavaScript -->
      <article class="page-content" id="pageContent">
        <p class="loading">Loading little memories... ♡</p>
      </article>

      <!-- Navigation buttons -->
      <nav class="page-navigation" aria-label="Navigasi scrapbook">

        <button
          id="prevBtn"
          class="nav-btn"
          type="button"
        >
          ← Previous
        </button>

        <div id="pageDots" class="page-dots"></div>

        <button
          id="nextBtn"
          class="nav-btn primary"
          type="button"
        >
          Next →
        </button>

      </nav>

      <!-- Background music -->
      <div class="music-area">
        <button
          id="musicBtn"
          class="music-btn"
          type="button"
        >
          ♫ Play our song
        </button>

        <audio id="backgroundMusic" loop preload="none">
          <source
            src="img/gluesong.mp3"
            type="audio/mpeg"
          >
        </audio>
      </div>

    </section>

    <!-- Footer -->
    <footer class="scrapbook-footer">
      <p>
        Made with love, pressed between these pages ♡
      </p>

      <a href="page3.html" class="next-page-link">
        Continue our story →
      </a>
    </footer>

  </main>

  <!-- Toast notification -->
  <div
    id="toast"
    class="toast"
    aria-live="polite"
  ></div>

  <!-- File JavaScript -->
  <script src="script2.js"></script>

</body>
</html>
